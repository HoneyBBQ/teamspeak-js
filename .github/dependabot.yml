version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Matches minimumReleaseAge in pnpm-workspace.yaml: a version younger than
    # that cannot be resolved by pnpm, so it is not proposed either. Security
    # updates ignore the cooldown.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The consumer project the type-check job installs with npm has its own
  # lockfile, which the root entry does not look at.
  #
  # typescript and @types/node here are floor pins, not stale versions: the
  # "Types (TypeScript 5.2)" job checks the oldest supported toolchain
  # (TypeScript 5.2, @types/node 22 for the Node 22.12 floor). Dependabot must
  # not move them past that; raise them by hand together with ci.yml and
  # docs/compatibility.md. Security updates still apply within the allowed
  # range, and @noble/curves keeps tracking its latest release.
  - package-ecosystem: "npm"
    directory: "/test/types"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The server images the integration job runs against, and the nginx front.
  # CI reads them from ci/images (scripts/ci-image.sh), as Dependabot only
  # looks at Dockerfiles, not at `services` or `docker run` in a workflow.
  - package-ecosystem: "docker"
    directory: "/ci/images"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The codeql-action steps of one workflow must run the same version, so
    # they are bumped together, in one pull request with the other actions.
    groups:
      github-actions:
        patterns:
          - "*"

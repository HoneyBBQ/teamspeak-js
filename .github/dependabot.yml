version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The codeql-action steps of one workflow must run the same version, so
    # they are bumped together, in one pull request with the other actions.
    groups:
      github-actions:
        patterns:
          - "*"

name: Release

# Pushing a tag vX.Y.Z publishes @honeybbq/teamspeak at version X.Y.Z. The
# version itself comes from changesets (`pnpm version-packages`).

on:
  push:
    tags:
      - "v*"

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # A tag can be pushed on any commit. Only one that main (or, for a
  # maintenance release, a release/* branch) already contains is released.
  check-tag:
    name: Check the tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tagged commit is on main or a release branch
        run: |
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "$GITHUB_REF_NAME is on $branch"
              exit 0
            fi
          done
          echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main or a release/* branch" >&2
          exit 1
      # The release notes are written after npm has published, so a changelog
      # without a section for the tag has to stop the release here, first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check the changelog has a section for the tag
        run: node scripts/release-notes.mts "$GITHUB_REF_NAME" > /dev/null

  ci:
    name: CI
    needs: check-tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # For npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "package.json is at $version, but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # A prerelease goes out under its own dist-tag — 1.0.0-beta.1 under
      # "beta" — so `npm install` keeps resolving to the latest stable release.
      - name: Choose the dist-tag
        id: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: pnpm build
      - name: Publish
        run: pnpm publish --access public --no-git-checks --provenance --tag "${{ steps.dist.outputs.tag }}"

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      # The one job that writes to the repository: it creates the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The notes are the changelog of @honeybbq/teamspeak, which needs no
      # dependencies installed. Fails, and so stops the release, when it has
      # no section for the tag.
      - name: Write the release notes
        run: node scripts/release-notes.mts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

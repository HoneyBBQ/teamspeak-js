name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. Pushes to main
# are never cancelled: each one is a commit that should be seen to pass.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: oxlint
        run: pnpm lint
      - name: oxfmt
        run: pnpm fmt:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ["22.12.0", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The published declarations use `using` and `Disposable`, so the oldest
  # TypeScript that reads them is part of the supported environments (see
  # "Compatibility" in the README). Raising it is a minor release with a
  # changelog note; change the version here and in the README together.
  types:
    name: Types (TypeScript 5.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Type-check a consumer of the packed package
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm pack --pack-destination "$RUNNER_TEMP/packs"
          cp -r test/types "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm ci --no-audit --no-fund
          # Unpack the tarball by hand rather than `npm install`ing it: its name
          # and hash change every build, so no lockfile can pin it. Its runtime
          # dependency (@noble/curves, whose types the declarations import) is
          # pinned in test/types/package-lock.json instead.
          mkdir -p node_modules/@honeybbq/teamspeak
          tar -xzf "$RUNNER_TEMP"/packs/*.tgz -C node_modules/@honeybbq/teamspeak --strip-components=1
          npx tsc --version
          npx tsc -p .

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changeset check measures from the merge base with main, which
          # a shallow clone does not reach.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Lint what npm would receive, not the workspace: the published
      # package.json is rewritten by publishConfig, and workspace:* by pack.
      # Every exported symbol, as a user imports it, has a doc comment.
      - run: pnpm check:docs
      # The Material theme loads as a TypeDoc plugin and falls back to the
      # default theme, without an error, when it does not load. It builds that
      # way, so only the output shows it: this builds the reference and checks
      # the theme is in it.
      - run: pnpm check:theme
      # A changeset written straight into .changeset/pre/ is skipped by
      # `changeset version` and drops out of the changelog; only the release
      # commit writes there. Also catches a wrong package name or bump.
      - run: pnpm check:changesets
      # Known vulnerabilities in what consumers install: production
      # dependencies only, since a dev tool's advisory is not theirs.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      # The public API of each published package is recorded in api/*.api.md
      # and reviewed like code. This fails, with a diff, when the built
      # declarations and the record disagree, so a change to the API cannot
      # land without showing up in the commit that makes it. To accept a
      # deliberate change: pnpm api:report
      - run: pnpm api:check
      # A client version that was exported can be in use: a pull request may
      # add entries, never remove one.
      - name: Check no client version was removed
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";
            const file = "src/versions/index.ts";
            const names = (text) => new Set([...text.matchAll(/^export const (\w+)/gm)].map((m) => m[1]));
            let before;
            try {
              before = execFileSync("git", ["show", `origin/main:${file}`], { encoding: "utf8" });
            } catch {
              console.log(`${file} is not on main yet`);
              process.exit(0);
            }
            const after = names(readFileSync(file, "utf8"));
            const removed = [...names(before)].filter((n) => !after.has(n));
            if (removed.length > 0) {
              console.error(`removed from ${file}: ${removed.join(", ")}`);
              process.exit(1);
            }
          '
      - name: Check the packed package
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm pack --pack-destination "$RUNNER_TEMP/packs"
          tarball=$(echo "$RUNNER_TEMP"/packs/*.tgz)
          pnpm exec publint --strict "$tarball"
          pnpm exec attw --profile esm-only "$tarball"

  # Both supported server generations, because they differ in ways that only
  # show up live: TS6 hashes client uids with SHA-256 where TS3 uses SHA-1.
  integration:
    name: Integration (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: TS3
            image: teamspeak:latest
            # TS3 serves raw ServerQuery on 10011, and SSH and WebQuery once the
            # service below lists them in query_protocols. With a raw port the
            # fixture provisions over it and creates the WebQuery api key
            # there, since TS3 prints none; the suite then runs over all three.
            query_host: 127.0.0.1
            query_http: 127.0.0.1:10080
            query_port: 10011
            query_ssh_port: 10022
            # TS3 has no guest ServerQuery access.
            query_guest: ""
          - name: TS6
            image: teamspeaksystems/teamspeak6-server:latest
            # TS6 dropped raw ServerQuery for HTTP, so the fixture talks
            # WebQuery here — the same commands over a different transport.
            query_host: ""
            query_http: 127.0.0.1:10080
            query_port: 10080
            # TS6 also serves ServerQuery over SSH, which is the transport that
            # carries the serveradmin password and checks the host key, so the
            # suite has to reach it. Off unless the service enables it below.
            query_ssh_port: 10022
            # TS6 serves guest ServerQuery access over SSH and WebQuery, on by
            # default, so the guest tests run here.
            query_guest: "1"
    services:
      teamspeak:
        image: ${{ matrix.server.image }}
        env:
          TS3SERVER_LICENSE: accept
          TSSERVER_LICENSE_ACCEPTED: accept
          # TS3 takes its query protocols as a list, and SSH ServerQuery logs in
          # with the serveradmin password, so it is set here to be known.
          TS3SERVER_QUERY_PROTOCOLS: raw,ssh,http
          TS3SERVER_SERVERADMIN_PASSWORD: ci-serveradmin-password
          # TS6 switches each on separately, and is given the same password.
          TSSERVER_QUERY_HTTP_ENABLED: "1"
          TSSERVER_QUERY_SSH_ENABLED: "1"
          TSSERVER_QUERY_ADMIN_PASSWORD: ci-serveradmin-password
        ports:
          - 9987:9987/udp
          - 10011:10011
          - 10080:10080
          - 10022:10022
          # File transfer: the server hands out this port with each transfer
          # key, so it must be reachable at the same number from the runner.
          - 30033:30033
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Wait for the ServerQuery ports to answer rather than for a fixed time:
      # TS3 and TS6 take different times to start, and a slow runner longer. TS3
      # opens its SSH and HTTP ports a few seconds after the raw one, so each
      # that the suite uses is waited for.
      - name: Wait for server to be ready
        run: |
          for port in ${{ matrix.server.query_port }} ${{ matrix.server.query_ssh_port }}; do
            for i in $(seq 1 60); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
                echo "ServerQuery port $port answered after ${i}s"
                continue 2
              fi
              sleep 1
            done
            echo "ServerQuery port $port did not answer within 60s" >&2
            exit 1
          done
      # The suite needs channels and permissions. Skipping this is how the
      # tests pass while testing nothing: they skip on permissions instead of
      # failing, which hid a row-parsing bug for months.
      - name: Provision the fixture
        env:
          # Outside the checkout, so the fixture leaves the working tree clean.
          TS3_FIXTURE_ENV: ${{ runner.temp }}/ts3-fixture.env
        run: |
          sudo apt-get install -y netcat-openbsd >/dev/null
          TS3_QUERY_HOST='${{ matrix.server.query_host }}' \
          TS3_QUERY_HTTP='${{ matrix.server.query_http }}' \
          TS3_QUERY_PORT='${{ matrix.server.query_port }}' \
          TS3_QUERY_SSH_PORT='${{ matrix.server.query_ssh_port }}' \
          TS3_QUERY_SSH_PASSWORD=ci-serveradmin-password \
          TS3_ADMIN_PW=ci-serveradmin-password \
          TS3_QUERY_GUEST='${{ matrix.server.query_guest }}' \
          ./scripts/ts3-fixture.sh
      # WebQuery over HTTPS, with a certificate from a CA made for this run
      # that only the HTTPS tests are told to trust. TS6 serves HTTPS itself,
      # but a service container cannot be given files the job writes, so a
      # second TS6 server is started here with the certificate. It also serves
      # plain HTTP, only so the fixture can relax its query flood limit, which
      # would otherwise ban the runner after a handful of connections. TS3 has
      # no HTTPS WebQuery, so nginx terminates TLS in front of the service's
      # plain HTTP one, the very server the fixture provisioned. Both append
      # what the tests need to the fixture's file.
      - name: Serve WebQuery over HTTPS
        env:
          TS3_FIXTURE_ENV: ${{ runner.temp }}/ts3-fixture.env
          TLS_DIR: ${{ runner.temp }}/webquery-tls
        run: |
          ./scripts/webquery-tls.sh "$TLS_DIR"
          # Whether the server answers over HTTP(S), whatever it says: a port
          # that is published accepts connections before the server listens.
          answers() {
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 --cacert "$TLS_DIR/ca.pem" "$1")" != 000 ]
          }
          if [ '${{ matrix.server.name }}' = TS6 ]; then
            docker run -d --name webquery-https -v "$TLS_DIR:/tls:ro" \
              -e TSSERVER_LICENSE_ACCEPTED=accept \
              -e TSSERVER_QUERY_HTTP_ENABLED=1 \
              -e TSSERVER_QUERY_HTTPS_ENABLED=1 \
              -e TSSERVER_QUERY_HTTPS_CERT=/tls/server.pem \
              -e TSSERVER_QUERY_HTTPS_PRIVATE_KEY=/tls/server.key \
              -p 10081:10080 -p 10443:10443 ${{ matrix.server.image }}
            for url in http://127.0.0.1:10081 https://127.0.0.1:10443; do
              for i in $(seq 1 60); do
                if answers "$url/1/version"; then continue 2; fi
                sleep 1
              done
              docker logs webquery-https
              echo "$url did not answer within 60s" >&2
              exit 1
            done
            TS3_FIXTURE_ENV="$RUNNER_TEMP/https-fixture.env" \
            TS3_CONTAINER=webquery-https \
            TS3_QUERY_HTTP=127.0.0.1:10081 \
            TS3_QUERY_PORT=10081 \
            ./scripts/ts3-fixture.sh
            api_key=$(sed -n 's/^export TEAMSPEAK_QUERY_API_KEY=//p' "$RUNNER_TEMP/https-fixture.env")
            [ -n "$api_key" ] || { echo "the fixture wrote no api key" >&2; exit 1; }
            echo "export TEAMSPEAK_QUERY_HTTPS_API_KEY=$api_key" >> "$TS3_FIXTURE_ENV"
          else
            cat > "$RUNNER_TEMP/nginx.conf" <<'NGINX'
          events {}
          http {
            server {
              listen 10443 ssl;
              ssl_certificate /tls/server.pem;
              ssl_certificate_key /tls/server.key;
              location / {
                proxy_pass http://127.0.0.1:10080;
              }
            }
          }
          NGINX
            # nginx 1.31.6 (alpine), by digest so the front cannot change under the tests.
            docker run -d --name webquery-https --network host \
              -v "$TLS_DIR:/tls:ro" -v "$RUNNER_TEMP/nginx.conf:/etc/nginx/nginx.conf:ro" \
              docker.io/library/nginx@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
            for i in $(seq 1 30); do
              if answers https://127.0.0.1:10443/1/version; then break; fi
              sleep 1
            done
            answers https://127.0.0.1:10443/1/version || { docker logs webquery-https; exit 1; }
          fi
          {
            echo "export TEAMSPEAK_QUERY_HTTPS_URL=https://127.0.0.1:10443"
            echo "export TEAMSPEAK_QUERY_HTTPS_CA=$TLS_DIR/ca.pem"
          } >> "$TS3_FIXTURE_ENV"
      - name: Run integration tests
        env:
          # Where the fixture wrote its environment file.
          TS3_FIXTURE_ENV: ${{ runner.temp }}/ts3-fixture.env
        run: |
          set -a
          . "$TS3_FIXTURE_ENV"
          set +a
          pnpm test:integration
      # The instance tests stop and delete virtual servers, edit the instance,
      # reset every permission and finally stop the server process, so they run
      # alone, after everything above that needs the server, and the stop is
      # the last test of the last file. The job's server is thrown away with the
      # job, which is what makes that allowed. They run even when the step
      # above failed, so one broken test does not hide these.
      - name: Run instance tests
        if: ${{ !cancelled() }}
        env:
          TS3_FIXTURE_ENV: ${{ runner.temp }}/ts3-fixture.env
        run: |
          set -a
          . "$TS3_FIXTURE_ENV"
          set +a
          pnpm test:integration:instance
